name: Stator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Copy self-hosted FFmpeg WASM assets
        run: npm run copy-wasm

      - name: Run Vitest unit & integration suite
        run: npm run test

      - name: TypeScript type check
        run: npm run lint

      - name: Production Vite + PWA build
        run: npm run build

      - name: Verify bundled WASM and PWA artifacts
        run: |
          test -s dist/wasm/core-mt/ffmpeg-core.wasm
          test -s dist/wasm/core-st/ffmpeg-core.wasm
          test -s dist/manifest.webmanifest
