
name: Stator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Copy self-hosted FFmpeg WASM assets
        run: bun run copy-wasm

      - name: Run Vitest unit & integration suite
        run: bun run test

      - name: TypeScript type check
        run: bun run lint

      - name: Production Vite + PWA build
        run: bun run build

      - name: Verify bundled WASM and PWA artifacts
        run: |
          test -s dist/wasm/core-mt/ffmpeg-core.wasm
          test -s dist/wasm/core-st/ffmpeg-core.wasm
          test -s dist/manifest.webmanifest
