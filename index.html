<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAF9F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stator" />
    <title>Stator</title>
    <meta
      name="description"
      content="Privacy-first, open-source local media workspace. Edit, convert, compress, and compare video, audio, images, and GIFs directly in browser memory."
    />
    <meta property="og:title" content="Stator" />
    <meta
      property="og:description"
      content="Privacy-first, open-source local media workspace. Edit, convert, compress, and compare video, audio, images, and GIFs directly in browser memory."
    />
    <meta property="og:site_name" content="Stator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stator" />
    <meta
      name="twitter:description"
      content="Privacy-first, open-source local media workspace. Edit, convert, compress, and compare video, audio, and images directly in browser memory."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('stator_theme') || localStorage.getItem('omniconvert_theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#101112' : '#FAF9F7');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF9F7] dark:bg-[#101112] text-[#292A2D] dark:text-[#F4F3F0] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
