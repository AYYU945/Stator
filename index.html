    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#F6F5F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stator" />
    <title>Stator | Local Media Studio</title>
    <meta name="description" content="Privacy-first local media conversion studio. Convert, crop, and optimize video, audio, and images directly in browser memory via WebAssembly. Zero uploads." />
    <meta property="og:title" content="Stator | Local Media Studio" />
    <meta property="og:description" content="Privacy-first local media conversion studio. Convert, crop, and optimize video, audio, and images directly in browser memory via WebAssembly. Zero uploads." />
    <meta property="og:site_name" content="Stator" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stator | Local Media Studio" />
    <meta name="twitter:description" content="Privacy-first local media conversion studio. Convert, crop, and optimize video, audio, and images directly in browser memory via WebAssembly. Zero uploads." />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('stator_theme') || localStorage.getItem('omniconvert_theme');
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F5F1] dark:bg-[#0A0B0E] text-[#111215] dark:text-[#F3F4F6] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
